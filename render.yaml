services:
  - type: web
    name: filmmatch
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: '8000'
      - key: DATABASE_URL
        sync: false
      - key: FILMMATCH_ADMIN_TOKEN
        generateValue: true
