name: FilmMatch
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check filmmatch tests
      - run: python -m pytest -q
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose up --build --wait
      - run: npm run test:e2e --prefix frontend
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down

  deploy:
    if: github.event_name == 'push' && vars.FILMMATCH_DEPLOY_HOST != ''
    needs: test
    runs-on: ubuntu-latest
    concurrency: filmmatch-production
    environment: production
    steps:
      - name: Deploy and check public readiness
        env:
          DEPLOY_HOST: ${{ vars.FILMMATCH_DEPLOY_HOST }}
          PUBLIC_URL: ${{ vars.FILMMATCH_PUBLIC_URL }}
          DEPLOY_KEY: ${{ secrets.FILMMATCH_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.FILMMATCH_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" && test -n "$PUBLIC_URL" && test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          ssh -i "$RUNNER_TEMP/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/known_hosts" -- "$DEPLOY_HOST" bash -s -- "$GITHUB_SHA" <<'DEPLOY'
          set -euo pipefail
          cd "$HOME/filmmatch"
          git fetch origin main
          git checkout --detach "$1"
          docker compose up -d --build --wait
          DEPLOY
          curl --fail --silent --show-error --retry 4 "$PUBLIC_URL/api/health"
          curl --fail --silent --show-error "$PUBLIC_URL/api/evidence" > /dev/null
